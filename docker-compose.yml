version: '3.8'

services:
  tradingview-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingview-webhook-bridge
    ports:
      - "25345:25345"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:25345/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - tradingview-logs:/app/logs
    networks:
      - tradingview-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  tradingview-logs:
    driver: local

networks:
  tradingview-network:
    driver: bridge
